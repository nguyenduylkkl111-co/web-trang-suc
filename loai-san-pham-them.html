<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm loại sản phẩm — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb"><a href="index.html">Trang chủ quản trị</a> › <a href="loai-san-pham.html">Loại sản phẩm</a> › Thêm mới</div>
      <div class="card">
        <h2>Thêm loại sản phẩm</h2>
        <form id="catForm" novalidate>
          <div class="form-grid">
            <div class="field"><label for="ma">Mã loại <span class="req">*</span></label><input type="text" id="ma" maxlength="15" placeholder="VD: LSP05"><div class="error" id="err-ma"></div></div>
            <div class="field"><label for="ten">Tên loại <span class="req">*</span></label><input type="text" id="ten" placeholder="VD: Mặt dây chuyền"><div class="error" id="err-ten"></div></div>
            <div class="field full"><label for="moTa">Mô tả</label><textarea id="moTa" rows="3"></textarea></div>
          </div>
          <div class="form-actions"><button class="btn" type="submit">Lưu</button><a class="btn ghost" href="loai-san-pham.html">Hủy</a></div>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('loai-san-pham', 'Thêm loại sản phẩm')) {
  A.$('catForm').onsubmit = function (e) {
    e.preventDefault();
    var ma = A.$('ma').value.trim().toUpperCase(), ten = A.$('ten').value.trim(), moTa = A.$('moTa').value.trim(), cats = A.get(A.K.cats);
    var eMa = '', eTen = '';
    if (!/^[A-Z0-9_-]{3,15}$/.test(ma)) eMa = 'Mã gồm 3–15 ký tự chữ/số/gạch.';
    else if (cats.some(function (c) { return c.ma === ma; })) eMa = 'Mã loại đã tồn tại.';
    if (ten.length < 2) eTen = 'Tên loại tối thiểu 2 ký tự.';
    else if (cats.some(function (c) { return c.ten.toLowerCase() === ten.toLowerCase(); })) eTen = 'Tên loại đã tồn tại.';
    A.$('err-ma').textContent = eMa; A.$('err-ten').textContent = eTen;
    if (eMa || eTen) return;
    cats.push({ id: A.uid('c'), ma: ma, ten: ten, moTa: moTa, an: false });
    A.set(A.K.cats, cats);
    sessionStorage.setItem('jw_flash', 'Đã thêm loại "' + ten + '"');
    location.href = 'loai-san-pham.html';
  };
}
</script>
</body>
</html>
