<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sửa sản phẩm — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb"><a href="index.html">Trang chủ quản trị</a> › <a href="san-pham.html">Sản phẩm</a> › Sửa</div>
      <div class="card" id="formArea">
        <h2>Sửa sản phẩm</h2>
        <form id="prodForm" novalidate>
          <div class="form-grid">
            <div class="field"><label for="loaiId">Loại sản phẩm <span class="req">*</span></label><select id="loaiId"></select><div class="error" id="err-loai"></div></div>
            <div class="field"><label for="ma">Mã sản phẩm <span class="req">*</span></label><input type="text" id="ma" maxlength="15"><div class="error" id="err-ma"></div></div>
            <div class="field"><label for="ten">Tên sản phẩm <span class="req">*</span></label><input type="text" id="ten"><div class="error" id="err-ten"></div></div>
            <div class="field"><label for="gia">Giá bán (₫) <span class="req">*</span></label><input type="number" id="gia" min="0" step="1000"><div class="error" id="err-gia"></div></div>
            <div class="field full"><label for="hinhFile">Hình sản phẩm</label><input type="file" id="hinhFile" accept="image/*"><div class="hint">Để trống nếu giữ nguyên hình hiện tại.</div><div class="error" id="err-hinh"></div><img id="preview" class="preview" alt="Hình hiện tại" style="display:none"></div>
            <div class="field full"><label for="moTa">Mô tả <span class="req">*</span></label><textarea id="moTa" rows="4"></textarea><div class="error" id="err-moTa"></div></div>
          </div>
          <div class="form-actions"><button class="btn" type="submit">Cập nhật</button><a class="btn ghost" href="san-pham.html">Hủy</a></div>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>if (A.layout('san-pham', 'Sửa sản phẩm')) A.initProductForm('edit');</script>
</body>
</html>
