<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xóa / ẩn sản phẩm — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb"><a href="index.html">Trang chủ quản trị</a> › <a href="san-pham.html">Sản phẩm</a> › Xóa / ẩn</div>
      <div class="card" id="box"></div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('san-pham', 'Xóa / ẩn sản phẩm')) {
  var p = A.findBy(A.K.prods, A.param('id')), box = A.$('box');
  function done(icon, title, msg) {
    box.innerHTML = '<div class="result-box ok"><div class="big">' + icon + '</div><h2>' + title + '</h2><p>' + msg + '</p><a class="btn" href="san-pham.html">Về danh sách sản phẩm</a></div>';
  }
  if (!p) {
    box.innerHTML = '<div class="result-box fail"><div class="big">⚠️</div><h2>Không tìm thấy sản phẩm</h2><a class="btn" href="san-pham.html">Về danh sách</a></div>';
  } else {
    // Đã từng bán => chỉ ẩn (giữ lịch sử đơn hàng); chưa bán => xóa hẳn
    var willHide = !!p.daBan;
    box.innerHTML = '<h2>' + (willHide ? 'Ẩn sản phẩm' : 'Xóa sản phẩm') + '</h2>' +
      '<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px"><img class="thumb" src="' + p.hinh + '" alt=""><div><b>' + A.esc(p.ten) + '</b><div class="muted">Mã: ' + A.esc(p.ma) + ' · ' + A.money(p.gia) + '</div></div></div>' +
      (willHide
        ? '<p>Sản phẩm này <b>đã từng được bán</b> nên không thể xóa. Hệ thống sẽ <b>ẩn</b> khỏi cửa hàng và giữ lại dữ liệu cho đơn hàng cũ.</p>'
        : '<p>Sản phẩm <b>chưa phát sinh giao dịch</b> nên sẽ bị <b>xóa vĩnh viễn</b>. Hành động này không thể hoàn tác.</p>') +
      '<div class="form-actions"><button class="btn danger" id="ok">' + (willHide ? 'Xác nhận ẩn' : 'Xác nhận xóa') + '</button><a class="btn ghost" href="san-pham.html">Hủy</a></div>';
    A.$('ok').onclick = function () {
      if (willHide) {
        var l = A.get(A.K.prods); l.forEach(function (x) { if (x.id === p.id) x.an = true; }); A.set(A.K.prods, l);
        done('🙈', 'Đã ẩn sản phẩm', 'Sản phẩm "' + A.esc(p.ten) + '" không còn hiển thị trên cửa hàng.');
      } else {
        A.set(A.K.prods, A.get(A.K.prods).filter(function (x) { return x.id !== p.id; }));
        done('🗑️', 'Đã xóa sản phẩm', 'Sản phẩm "' + A.esc(p.ten) + '" đã được xóa khỏi hệ thống.');
      }
    };
  }
}
</script>
</body>
</html>
