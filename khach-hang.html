<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khách hàng — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb">Trang chủ quản trị › Khách hàng</div>
      <div class="card">
        <div class="toolbar">
          <input type="search" id="q" placeholder="Tìm theo tên, email, SĐT...">
          <select id="fStatus">
            <option value="">Tất cả trạng thái</option>
            <option value="ok">Đang hoạt động</option>
            <option value="off">Đã khóa</option>
          </select>
          <span class="spacer"></span>
          <span class="muted" id="count"></span>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>#</th><th>Họ tên</th><th>Email</th><th>SĐT</th><th>Ngày đăng ký</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('khach-hang', 'Quản lý khách hàng')) {
  var page = 1, SIZE = 8;
  var flash = sessionStorage.getItem('jw_flash');
  if (flash) { sessionStorage.removeItem('jw_flash'); A.toast(flash); }

  function render() {
    var q = A.$('q').value.trim().toLowerCase(), st = A.$('fStatus').value;
    var list = A.get(A.K.users).filter(function (u) {
      var m = !q || (u.hoTen + ' ' + u.email + ' ' + u.sdt).toLowerCase().indexOf(q) >= 0;
      var s = !st || (st === 'off') === !!u.khoa;
      return m && s;
    });
    var pg = A.paginate(list, page, SIZE); page = pg.page;
    A.$('count').textContent = list.length + ' khách hàng';
    A.$('rows').innerHTML = pg.items.length ? pg.items.map(function (u, i) {
      return '<tr><td>' + ((page - 1) * SIZE + i + 1) + '</td><td><b>' + A.esc(u.hoTen) + '</b></td><td>' + A.esc(u.email) + '</td><td>' + A.esc(u.sdt) + '</td><td>' + A.esc(u.ngayDK) + '</td>' +
        '<td><span class="badge ' + (u.khoa ? 'off' : 'ok') + '">' + (u.khoa ? 'Đã khóa' : 'Hoạt động') + '</span></td>' +
        '<td><div class="actions"><a class="btn small ghost" href="khach-hang-reset-mk.html?id=' + u.id + '">Reset mật khẩu</a>' +
        '<button class="btn small ' + (u.khoa ? '' : 'danger') + '" data-id="' + u.id + '" data-act="' + (u.khoa ? 'unlock' : 'lock') + '">' + (u.khoa ? 'Mở khóa' : 'Khóa') + '</button></div></td></tr>';
    }).join('') : '<tr><td class="empty" colspan="7">Không có khách hàng phù hợp.</td></tr>';
    A.renderPager(A.$('pager'), page, pg.pages, function (p) { page = p; render(); });
  }
  A.$('q').oninput = A.$('fStatus').onchange = function () { page = 1; render(); };
  A.$('rows').onclick = function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var u = A.findBy(A.K.users, b.dataset.id), lock = b.dataset.act === 'lock';
    A.confirmBox(lock ? 'Khóa tài khoản?' : 'Mở khóa tài khoản?',
      (lock ? 'Khách hàng "' : 'Khách hàng "') + u.hoTen + (lock ? '" sẽ không thể đăng nhập.' : '" sẽ đăng nhập lại được bình thường.'),
      function () { location.href = 'khach-hang-khoa.html?id=' + u.id + '&act=' + b.dataset.act; }, lock ? 'Khóa' : 'Mở khóa');
  };
  render();
}
</script>
</body>
</html>
