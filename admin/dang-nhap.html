<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Đăng nhập quản trị | AURELIA Jewelry</title>
<meta name="description" content="AURELIA Jewelry - Website bán trang sức (đồ án Lập trình web và ứng dụng)" />
<link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
<link rel="stylesheet" type="text/css" href="../css/common.css" />
<link rel="stylesheet" type="text/css" href="../css/admin.css" />
</head>
<body class="admin-login">
 
<div class="login-wrap">
    <h1>AURELIA</h1>
    <p class="login-sub">Trang quản trị</p>
    <form name="frmAdminLogin" action="index.html" method="get">
        <div class="form-row">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" class="input w-full"  />
        </div>
        <div class="form-row">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" class="input w-full" />
        </div>
        <div class="form-row">
            <label class="radio-line"><input type="checkbox" name="remember" value="1" /> Ghi nhớ đăng nhập</label>
        </div>
        <input type="submit" class="btn btn-block" value="Đăng nhập" />
    </form>
 
    <p class="login-links">
        <a href="../index.html">&laquo; Về trang bán hàng</a>
    </p>
    <p class="login-demo">Tài khoản mẫu: <b>admin</b> / <b>admin123</b></p>
</div>
 
<p class="login-foot">&copy; 2026 AURELIA Jewelry &mdash; Đồ án Lập trình web và ứng dụng, Khoa CNTT, Đại học Sài Gòn</p>
 
</body>
</html>
