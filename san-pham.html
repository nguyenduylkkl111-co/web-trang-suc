<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sản phẩm — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb">Trang chủ quản trị › Sản phẩm</div>
      <div class="card">
        <div class="toolbar">
          <input type="search" id="q" placeholder="Tìm theo mã, tên sản phẩm...">
          <select id="fCat"></select>
          <select id="fStatus">
            <option value="">Tất cả trạng thái</option>
            <option value="show">Đang hiển thị</option>
            <option value="hide">Đã ẩn</option>
          </select>
          <span class="spacer"></span>
          <span class="muted" id="count"></span>
          <a class="btn" href="san-pham-them.html">+ Thêm sản phẩm</a>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>Hình</th><th>Mã</th><th>Tên sản phẩm</th><th>Loại</th><th>Giá bán</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('san-pham', 'Quản lý sản phẩm')) {
  var page = 1, SIZE = 6;
  var flash = sessionStorage.getItem('jw_flash');
  if (flash) { sessionStorage.removeItem('jw_flash'); A.toast(flash); }
  A.$('fCat').innerHTML = '<option value="">Tất cả loại</option>' + A.get(A.K.cats).map(function (c) { return '<option value="' + c.id + '">' + A.esc(c.ten) + '</option>'; }).join('');

  function render() {
    var q = A.$('q').value.trim().toLowerCase(), cat = A.$('fCat').value, st = A.$('fStatus').value;
    var list = A.get(A.K.prods).filter(function (p) {
      return (!q || (p.ma + ' ' + p.ten).toLowerCase().indexOf(q) >= 0) && (!cat || p.loaiId === cat) && (!st || (st === 'hide') === !!p.an);
    });
    var pg = A.paginate(list, page, SIZE); page = pg.page;
    A.$('count').textContent = list.length + ' sản phẩm';
    A.$('rows').innerHTML = pg.items.length ? pg.items.map(function (p) {
      return '<tr><td><img class="thumb" src="' + p.hinh + '" alt=""></td><td>' + A.esc(p.ma) + '</td><td><b>' + A.esc(p.ten) + '</b></td><td>' + A.esc(A.catName(p.loaiId)) + '</td><td>' + A.money(p.gia) + '</td>' +
        '<td><span class="badge ' + (p.an ? 'hide' : 'ok') + '">' + (p.an ? 'Đã ẩn' : 'Hiển thị') + '</span></td>' +
        '<td><div class="actions"><a class="btn small ghost" href="san-pham-sua.html?id=' + p.id + '">Sửa</a><a class="btn small danger" href="san-pham-xoa.html?id=' + p.id + '">Xóa / Ẩn</a></div></td></tr>';
    }).join('') : '<tr><td class="empty" colspan="7">Không có sản phẩm phù hợp.</td></tr>';
    A.renderPager(A.$('pager'), page, pg.pages, function (p) { page = p; render(); });
  }
  A.$('q').oninput = A.$('fCat').onchange = A.$('fStatus').onchange = function () { page = 1; render(); };
  render();
}
</script>
</body>
</html>
