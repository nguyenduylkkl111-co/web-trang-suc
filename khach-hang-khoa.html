<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết quả khóa / mở khóa — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb"><a href="index.html">Trang chủ quản trị</a> › <a href="khach-hang.html">Khách hàng</a> › Khóa / mở khóa</div>
      <div class="card" id="box"></div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('khach-hang', 'Khóa / mở khóa tài khoản')) {
  var id = A.param('id'), act = A.param('act'), box = A.$('box');
  var list = A.get(A.K.users), u = list.filter(function (x) { return x.id === id; })[0];
  if (!u || (act !== 'lock' && act !== 'unlock')) {
    box.innerHTML = '<div class="result-box fail"><div class="big">✖</div><h2>Thao tác không hợp lệ</h2><p>Không tìm thấy khách hàng hoặc yêu cầu sai.</p><a class="btn" href="khach-hang.html">Về danh sách</a></div>';
  } else {
    u.khoa = act === 'lock';
    A.set(A.K.users, list);
    box.innerHTML = '<div class="result-box ok"><div class="big">' + (u.khoa ? '🔒' : '🔓') + '</div><h2>' + (u.khoa ? 'Đã khóa tài khoản' : 'Đã mở khóa tài khoản') + '</h2><p>Khách hàng <b>' + A.esc(u.hoTen) + '</b> (' + A.esc(u.email) + ') ' + (u.khoa ? 'hiện không thể đăng nhập.' : 'đã có thể đăng nhập trở lại.') + '</p><a class="btn" href="khach-hang.html">Về danh sách khách hàng</a></div>';
  }
}
</script>
</body>
</html>
