<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sửa loại sản phẩm — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb"><a href="index.html">Trang chủ quản trị</a> › <a href="loai-san-pham.html">Loại sản phẩm</a> › Sửa</div>
      <div class="card" id="formArea">
        <h2>Sửa loại sản phẩm</h2>
        <form id="catForm" novalidate>
          <div class="form-grid">
            <div class="field"><label for="ma">Mã loại <span class="req">*</span></label><input type="text" id="ma" maxlength="15"><div class="error" id="err-ma"></div></div>
            <div class="field"><label for="ten">Tên loại <span class="req">*</span></label><input type="text" id="ten"><div class="error" id="err-ten"></div></div>
            <div class="field full"><label for="moTa">Mô tả</label><textarea id="moTa" rows="3"></textarea></div>
            <div class="field full"><label for="an">Trạng thái</label><select id="an"><option value="0">Hiển thị</option><option value="1">Ẩn</option></select></div>
          </div>
          <div class="form-actions"><button class="btn" type="submit">Cập nhật</button><a class="btn ghost" href="loai-san-pham.html">Hủy</a></div>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('loai-san-pham', 'Sửa loại sản phẩm')) {
  var cur = A.findBy(A.K.cats, A.param('id'));
  if (!cur) {
    A.$('formArea').innerHTML = '<div class="result-box fail"><div class="big">⚠️</div><h2>Không tìm thấy loại sản phẩm</h2><a class="btn" href="loai-san-pham.html">Về danh sách</a></div>';
  } else {
    A.$('ma').value = cur.ma; A.$('ten').value = cur.ten; A.$('moTa').value = cur.moTa || ''; A.$('an').value = cur.an ? '1' : '0';
    A.$('catForm').onsubmit = function (e) {
      e.preventDefault();
      var ma = A.$('ma').value.trim().toUpperCase(), ten = A.$('ten').value.trim(), moTa = A.$('moTa').value.trim(), an = A.$('an').value === '1';
      var cats = A.get(A.K.cats), others = cats.filter(function (c) { return c.id !== cur.id; }), eMa = '', eTen = '';
      if (!/^[A-Z0-9_-]{3,15}$/.test(ma)) eMa = 'Mã gồm 3–15 ký tự chữ/số/gạch.';
      else if (others.some(function (c) { return c.ma === ma; })) eMa = 'Mã loại đã tồn tại.';
      if (ten.length < 2) eTen = 'Tên loại tối thiểu 2 ký tự.';
      else if (others.some(function (c) { return c.ten.toLowerCase() === ten.toLowerCase(); })) eTen = 'Tên loại đã tồn tại.';
      A.$('err-ma').textContent = eMa; A.$('err-ten').textContent = eTen;
      if (eMa || eTen) return;
      cats.forEach(function (c) { if (c.id === cur.id) { c.ma = ma; c.ten = ten; c.moTa = moTa; c.an = an; } });
      A.set(A.K.cats, cats);
      sessionStorage.setItem('jw_flash', 'Đã cập nhật loại "' + ten + '"');
      location.href = 'loai-san-pham.html';
    };
  }
}
</script>
</body>
</html>
