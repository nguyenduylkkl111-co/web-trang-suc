<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng Điều Khiển — Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar"></aside>
  <div class="admin-main">
    <header id="topbar"></header>
    <main class="admin-content">
      <div class="breadcrumb">Trang chủ quản trị</div>
      <div class="stats" id="stats"></div>
      <div class="card">
        <h2>Danh mục chức năng</h2>
        <div class="func-grid">
          <a class="func" href="khach-hang.html"><div class="ico">👥</div><h3>Khách hàng</h3><p>Xem danh sách, đặt lại mật khẩu, khóa / mở khóa tài khoản.</p></a>
          <a class="func" href="loai-san-pham.html"><div class="ico">🗂️</div><h3>Loại sản phẩm</h3><p>Thêm, sửa, xóa hoặc ẩn loại sản phẩm.</p></a>
          <a class="func" href="san-pham.html"><div class="ico">💍</div><h3>Sản phẩm</h3><p>Thêm, sửa, xóa / ẩn sản phẩm; lọc và phân trang.</p></a>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin.js"></script>
<script>
if (A.layout('index', 'Bảng điều khiển')) {
  var u = A.get(A.K.users), c = A.get(A.K.cats), p = A.get(A.K.prods);
  var items = [
    [u.length, 'Khách hàng'],
    [u.filter(function (x) { return x.khoa; }).length, 'Tài khoản đang khóa'],
    [c.length, 'Loại sản phẩm'],
    [p.filter(function (x) { return !x.an; }).length, 'Sản phẩm đang bán'],
    [p.filter(function (x) { return x.an; }).length, 'Sản phẩm đã ẩn']
  ];
  A.$('stats').innerHTML = items.map(function (i) { return '<div class="stat"><div class="num">' + i[0] + '</div><div class="lbl">' + i[1] + '</div></div>'; }).join('');
}
</script>
</body>
</html>
